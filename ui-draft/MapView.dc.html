<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&family=Public+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --bg:oklch(97% 0.012 75); --surface:oklch(99% 0.007 75); --ink:oklch(23% 0.02 55);
      --ink-soft:oklch(48% 0.02 55); --line:oklch(88% 0.014 70); --accent:oklch(62% 0.14 40);
      --accent-ink:oklch(30% 0.06 40); --accent-soft:oklch(93% 0.03 40); --teal:oklch(58% 0.09 200);
      --teal-soft:oklch(93% 0.02 200); --map:oklch(94% 0.02 130);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:"Public Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
    a{color:var(--accent)} a:hover{color:var(--accent-ink)}
    .disp{font-family:"Newsreader",Georgia,serif}
  </style>
</helmet>

<div style="width:1280px;height:900px;background:var(--bg);display:flex;flex-direction:column">

  <div style="display:flex;align-items:center;justify-content:space-between;padding:22px 48px;border-bottom:1px solid var(--line)">
    <div class="disp" style="font-size:22px;font-weight:600;letter-spacing:-0.01em">다녀와<span style="color:var(--accent)">.</span></div>
    <div style="display:flex;align-items:center;gap:28px">
      <div style="display:flex;align-items:center;gap:8px;opacity:0.4"><div style="width:24px;height:24px;border-radius:999px;border:1px solid var(--ink-soft);font-size:12px;display:flex;align-items:center;justify-content:center">1</div><span style="font-size:14px">조건 입력</span></div>
      <div style="width:28px;height:1px;background:var(--line)"></div>
      <div style="display:flex;align-items:center;gap:8px;opacity:0.4"><div style="width:24px;height:24px;border-radius:999px;border:1px solid var(--ink-soft);font-size:12px;display:flex;align-items:center;justify-content:center">2</div><span style="font-size:14px">여행지 추천</span></div>
      <div style="width:28px;height:1px;background:var(--line)"></div>
      <div style="display:flex;align-items:center;gap:8px;opacity:0.4"><div style="width:24px;height:24px;border-radius:999px;border:1px solid var(--ink-soft);font-size:12px;display:flex;align-items:center;justify-content:center">3</div><span style="font-size:14px">코스</span></div>
      <div style="width:28px;height:1px;background:var(--line)"></div>
      <div style="display:flex;align-items:center;gap:8px"><div style="width:24px;height:24px;border-radius:999px;background:var(--accent);color:white;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center">4</div><span style="font-size:14px;font-weight:600">지도</span></div>
      <div style="width:28px;height:1px;background:var(--line)"></div>
      <div style="display:flex;align-items:center;gap:8px;opacity:0.4"><div style="width:24px;height:24px;border-radius:999px;border:1px solid var(--ink-soft);font-size:12px;display:flex;align-items:center;justify-content:center">5</div><span style="font-size:14px">예산</span></div>
    </div>
  </div>

  <div style="flex:1;display:flex">

    <!-- map area -->
    <div style="flex:1;position:relative;background:var(--map);overflow:hidden">
      <svg width="100%" height="100%" viewBox="0 0 900 800" style="position:absolute;inset:0" preserveAspectRatio="xMidYMid slice">
        <rect width="900" height="800" fill="oklch(94% 0.02 130)"/>
        <path d="M0 520 Q 220 460 380 540 T 900 500 V800 H0 Z" fill="oklch(90% 0.03 220)"/>
        <path d="M120 0 V800" stroke="oklch(88% 0.015 90)" stroke-width="18"/>
        <path d="M0 320 H900" stroke="oklch(88% 0.015 90)" stroke-width="14"/>
        <path d="M520 0 V800" stroke="oklch(91% 0.01 90)" stroke-width="10"/>
      </svg>

      <!-- route -->
      <svg width="100%" height="100%" viewBox="0 0 900 800" style="position:absolute;inset:0">
        <path d="M300 210 C 340 300, 420 320, 470 400 S 620 520, 660 610" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
      </svg>

      <!-- pin 1 -->
      <div style="position:absolute;left:280px;top:170px;display:flex;flex-direction:column;align-items:center">
        <div style="width:30px;height:30px;border-radius:999px 999px 999px 2px;background:var(--accent);transform:rotate(45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px oklch(40% 0.1 40 / 0.3)">
          <span style="transform:rotate(-45deg);color:white;font-size:13px;font-weight:700">1</span>
        </div>
      </div>
      <!-- pin 2 -->
      <div style="position:absolute;left:450px;top:360px;display:flex;flex-direction:column;align-items:center">
        <div style="width:30px;height:30px;border-radius:999px 999px 999px 2px;background:var(--accent);transform:rotate(45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px oklch(40% 0.1 40 / 0.3)">
          <span style="transform:rotate(-45deg);color:white;font-size:13px;font-weight:700">2</span>
        </div>
      </div>
      <!-- pin 3 -->
      <div style="position:absolute;left:640px;top:570px;display:flex;flex-direction:column;align-items:center">
        <div style="width:30px;height:30px;border-radius:999px 999px 999px 2px;background:var(--accent);transform:rotate(45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px oklch(40% 0.1 40 / 0.3)">
          <span style="transform:rotate(-45deg);color:white;font-size:13px;font-weight:700">3</span>
        </div>
      </div>

      <div style="position:absolute;left:24px;bottom:24px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:12.5px;display:flex;align-items:center;gap:8px">
        <div style="width:14px;height:2px;background:var(--accent)"></div>
        Day 1 동선 · 총 이동 19.1km
      </div>
      <div style="position:absolute;right:24px;top:24px;display:flex;flex-direction:column;gap:6px">
        <div style="width:36px;height:36px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600">+</div>
        <div style="width:36px;height:36px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600">–</div>
      </div>
    </div>

    <!-- sidebar -->
    <div style="width:380px;flex-shrink:0;background:var(--bg);border-left:1px solid var(--line);display:flex;flex-direction:column">
      <div style="padding:24px 24px 0">
        <div class="disp" style="font-size:20px;font-weight:600">동선 한눈에 보기</div>
        <div style="display:flex;gap:8px;margin-top:16px">
          <div style="padding:8px 16px;border-radius:999px;background:var(--accent);color:white;font-size:13px;font-weight:700">Day 1</div>
          <div style="padding:8px 16px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--ink-soft)">Day 2</div>
          <div style="padding:8px 16px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--ink-soft)">Day 3</div>
          <div style="padding:8px 16px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--ink-soft)">Day 4</div>
        </div>
      </div>

      <div style="padding:20px 24px;display:flex;flex-direction:column;gap:0;flex:1;overflow:auto">

        <div style="display:flex;gap:14px">
          <div style="display:flex;flex-direction:column;align-items:center">
            <div style="width:24px;height:24px;border-radius:999px;background:var(--accent);color:white;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center">1</div>
            <div style="width:1.5px;flex:1;background:var(--line);margin:4px 0"></div>
          </div>
          <div style="padding-bottom:6px">
            <div style="font-size:14px;font-weight:600">미케 비치</div>
            <div style="font-size:12px;color:var(--ink-soft);margin-top:2px">10:00 · 해변</div>
          </div>
        </div>
        <div style="display:flex;gap:14px;padding:4px 0 4px 5px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ink-soft)" stroke-width="1.6"><path d="M13 5l7 7-7 7M4 12h16"/></svg>
          <div style="font-size:11.5px;color:var(--ink-soft)">차량 12분 · 4.1km</div>
        </div>
        <div style="display:flex;gap:14px">
          <div style="display:flex;flex-direction:column;align-items:center">
            <div style="width:24px;height:24px;border-radius:999px;background:var(--accent);color:white;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center">2</div>
            <div style="width:1.5px;flex:1;background:var(--line);margin:4px 0"></div>
          </div>
          <div style="padding-bottom:6px">
            <div style="font-size:14px;font-weight:600">바나힐 케이블카</div>
            <div style="font-size:12px;color:var(--ink-soft);margin-top:2px">14:00 · 액티비티</div>
          </div>
        </div>
        <div style="display:flex;gap:14px;padding:4px 0 4px 5px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ink-soft)" stroke-width="1.6"><path d="M13 5l7 7-7 7M4 12h16"/></svg>
          <div style="font-size:11.5px;color:var(--ink-soft)">차량 28분 · 15km</div>
        </div>
        <div style="display:flex;gap:14px">
          <div style="width:24px;height:24px;border-radius:999px;background:var(--accent);color:white;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center">3</div>
          <div>
            <div style="font-size:14px;font-weight:600">한시장 해산물 골목</div>
            <div style="font-size:12px;color:var(--ink-soft);margin-top:2px">19:00 · 식당</div>
          </div>
        </div>
      </div>

      <div style="padding:18px 24px;border-top:1px solid var(--line)">
        <div style="background:var(--ink);color:white;border-radius:12px;padding:13px;text-align:center;font-size:14px;font-weight:600">타임라인으로 보기</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
